<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Muhammad Ahad - Full-Stack Developer and Tech Creator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0b2447"/>
      <stop offset="1" stop-color="#1a1448"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#dots)"/>
    <circle cx="170" cy="60" r="230" fill="url(#glow1)">
      <animate attributeName="cx" values="170;260;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="210" r="250" fill="url(#glow2)">
      <animate attributeName="cx" values="850;760;850" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- animated waves -->
    <g opacity="0.55">
      <path fill="#22d3ee" fill-opacity="0.18" d="M0 240 Q125 210 250 240 T500 240 T750 240 T1000 240 T1250 240 T1500 240 T1750 240 T2000 240 V280 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path fill="#818cf8" fill-opacity="0.22" d="M0 252 Q125 232 250 252 T500 252 T750 252 T1000 252 T1250 252 T1500 252 T1750 252 T2000 252 V280 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
      <text x="500" y="112" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="1">Muhammad Ahad
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="500" y="156" font-size="28" font-weight="600" fill="url(#accent)">Full-Stack Developer  •  Tech Creator
        <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
      </text>
      <text x="500" y="196" font-size="16" fill="#cbd5e1" letter-spacing="1.5">HTML  •  CSS  •  JavaScript  •  React  •  PHP  •  .NET  •  Flutter  •  Python  •  SQL
        <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.2s" fill="freeze"/>
      </text>
      <text x="500" y="228" font-size="15" fill="#94a3b8" letter-spacing="4">LEARN  •  CODE  •  BUILD
        <animate attributeName="opacity" values="0.5;1;0.5" begin="1.5s" dur="3s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
