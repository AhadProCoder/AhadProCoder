<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" role="img" aria-label="AhadProCoder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/><stop offset="0.55" stop-color="#0b2447"/><stop offset="1" stop-color="#1a1448"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="110" fill="url(#bg)"/>
    <path fill="#22d3ee" fill-opacity="0.18" d="M0 80 Q125 55 250 80 T500 80 T750 80 T1000 80 T1250 80 T1500 80 T1750 80 T2000 80 V110 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="#818cf8" fill-opacity="0.22" d="M0 92 Q125 72 250 92 T500 92 T750 92 T1000 92 T1250 92 T1500 92 T1750 92 T2000 92 V110 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <text x="500" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="url(#accent)">Thanks for visiting. Let's build something great together.</text>
  </g>
</svg>
